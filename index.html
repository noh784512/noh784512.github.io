<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테니스 대회 이력 조회</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>🎾 테니스 대회 이력 조회</h1>
    <p class="subtitle">KATA · KATO · 테니스타운 통합 검색 (남자부)</p>
  </header>

  <main class="container">
    <section class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="선수 이름을 입력하세요 (예: 홍길동)"
        autocomplete="off"
      />
      <button id="searchButton" type="button">검색</button>
    </section>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="results" class="results"></section>

    <footer class="site-footer">
      <p>
        데이터 출처: KATA · KATO · 테니스타운 ·
        <span id="lastUpdated"></span>
      </p>
      <p class="disclaimer">
        ※ 샘플 데이터로 동작 중입니다. 실제 랭킹과 무관합니다.
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
